<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docket</title>
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
    <aside>
        <h2 class="py-3">Docket</h2>
        <a href="index.html"><button class="btn btn-light mb-3">Login</button></a>
        <button class="btn btn-dark">Register</button>
    </aside>


    <main>
        <div class="registerForm">
            <div class="forma px-3 py-2">
                <h2 class="py-3 fs-1">Welcome Back</h2>
                <label for="registerName">Name</label>
                <input type="text" id="registerName" class="form-control mb-2" placeholder="enter your name">

                <label for="registerEmail">Email</label>
                <input type="email" id="registerEmail" class="form-control mb-2" placeholder="ex:@gmail.com">
                <p class="invalidEmail" id="invalidEmail"></p>

                <label for="registerPassword">Password</label>
                <input type="password" id="registerPassword" class="form-control mb-2" placeholder="enter your password">
                <p class="invalidPassword" id="invalidPassword"></p>


                <label for="registerPhone">Phone</label>
                <input type="tel" id="registerPhone" class="form-control mb-2" placeholder="ex:010XXXXXXXX">
                <p class="invalidPhone" id="invalidPhone"></p>

                <a id="register"><button class="btn btn-dark w-100 py-2 mb-4">register</button></a>
                <p class="successRegister text-success fs-6" id="successRegister"></p>

                <p class="w-100 text-center">already have an account? <a href="index.html">login here</a></p>
            </div>
            <div class="label">
                <h1>Docket</h1>
            </div>
        </div>
    </main>






    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
