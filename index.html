<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docket</title>
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <aside>
        <h2 class="py-3">Docket</h2>
        <a href="home1.html"><button class="btn btn-dark mb-3">Login</button></a>
        <a href="register.html"><button class="btn btn-light">Register</button></a>
    </aside>


    <main>
        <div class="loginForm">
            <div class="label">
                <h1>Docket</h1>
            </div>
            <div class="form px-3 py-4">
                <h2 class="py-3 mb-3 fs-1">Welcome Back</h2>
                <label for="loginEmailInput">Email</label>
                <input type="email" id="loginEmailInput" class="form-control mb-4" placeholder="ex:@gmail.com">

                <label for="loginPasswordInput">Password</label>
                <input type="password" id="loginPasswordInput" class="form-control mb-2" placeholder="enter your password">
                <p class="invalidMessage" id="invalidMessage"></p>

                <a id="login" href=""><button class="btn btn-dark w-100 py-2 mb-4">login</button></a>

                <p class="w-100 text-center">Don't have an account? <a href="register.html">Register here</a></p>
            </div>
        </div>
    </main>






    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
